<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מד הדלק השבועי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1f2328; --muted:#6b7280; --line:#e7e2d8;
  --green:#2f9e44; --amber:#f08c00; --red:#e03131; --accent:#3b5bdb; --soft:#f1efe9;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#15171a; --card:#1f2226; --ink:#eceff1; --muted:#9aa3ad; --line:#30343a; --soft:#272a2f; --accent:#748ffc; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:1.35rem;margin:0}
h2{font-size:1.05rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.muted{color:var(--muted);font-size:.9rem}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:8px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
button.icon{padding:6px 10px;font-size:1.1rem}
input{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:1px}

/* gauge */
.gauge-wrap{display:flex;flex-direction:column;align-items:center}
svg.gauge{width:100%;max-width:340px;height:auto;direction:ltr}
.needle{transition:transform .9s cubic-bezier(.3,1.4,.5,1);transform-origin:100px 100px}
.lamp{transition:opacity .3s}
.lamp.on{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.big{font-size:2rem;font-weight:700;margin-top:-6px}
.row{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.carry{margin-top:6px;font-size:.9rem;color:var(--red)}

/* mood */
.mood{display:flex;align-items:center;gap:14px;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--soft)}
.mood .face{font-size:2.6rem;line-height:1}
.mood.happy .face{animation:bounce 1.4s ease-in-out infinite}
.mood.warn .face{animation:shake .6s ease-in-out infinite}
.mood.sad .face{animation:droop 2.4s ease-in-out infinite}
.mood.happy{background:color-mix(in srgb,var(--green) 14%,var(--card))}
.mood.warn{background:color-mix(in srgb,var(--amber) 16%,var(--card))}
.mood.sad{background:color-mix(in srgb,var(--red) 14%,var(--card))}
.mood b{display:block}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-8px) rotate(-8deg)}60%{transform:translateY(0) rotate(8deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes droop{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

/* form */
form.add{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form.add .full{grid-column:1/-1}
form.add input.amount{font-size:1.4rem;font-weight:500}

/* lists */
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
ul.list li:first-child{border-top:0}
ul.list .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-variant-numeric:tabular-nums;font-weight:500}
.del{background:none;border:0;color:var(--muted);padding:2px 6px}
.del:hover{color:var(--red)}
.pill{font-size:.8rem;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.pill.bad{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.pill.now{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}

/* month */
.bar{height:14px;border-radius:99px;background:var(--soft);overflow:hidden;position:relative;margin:10px 0 4px}
.bar span{display:block;height:100%;border-radius:99px;transition:width .8s}
.bar i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.verdict{text-align:center;padding:10px 0 4px}
.verdict .face{font-size:4rem;line-height:1.1}
.verdict.win .face{animation:bounce 1.6s ease-in-out infinite}
.verdict.lose .face{animation:droop 2.4s ease-in-out infinite}
.verdict h3{margin:6px 0 2px;font-size:1.2rem}
.score{display:inline-block;margin-top:8px;padding:6px 14px;border-radius:12px;background:var(--soft);font-weight:500}

details summary{cursor:pointer;color:var(--muted);margin-top:4px}

/* confetti */
.confetti{position:fixed;top:-20px;font-size:1.4rem;pointer-events:none;animation:fall 2.2s ease-in forwards;z-index:9}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);width:min(420px,92vw);padding:20px}
dialog::backdrop{background:#0006}
dialog label{display:block;margin:10px 0 4px;font-size:.92rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
</style>
</head>
<body>
<main>
  <header>
    <h1>⛽ מד הדלק השבועי</h1>
    <button class="icon" id="openSettings" aria-label="הגדרות">⚙️</button>
  </header>

  <!-- this week -->
  <section class="card" id="weekCard">
    <div class="row"><h2 id="weekTitle">השבוע</h2><span class="muted" id="weekRange"></span></div>
    <div class="gauge-wrap">
      <svg class="gauge" viewBox="0 0 200 128" aria-hidden="true">
        <path id="arcRed"   fill="none" stroke="var(--red)"   stroke-width="14"/>
        <path id="arcAmber" fill="none" stroke="var(--amber)" stroke-width="14"/>
        <path id="arcGreen" fill="none" stroke="var(--green)" stroke-width="14"/>
        <g id="ticks" stroke="var(--muted)" stroke-width="1.5"></g>
        <text x="14" y="122" font-size="13" font-weight="700" fill="var(--red)">E</text>
        <text x="178" y="122" font-size="13" font-weight="700" fill="var(--green)">F</text>
        <text class="lamp" id="lamp" x="100" y="78" font-size="20" text-anchor="middle" opacity=".15">⛽</text>
        <g class="needle" id="needle">
          <line x1="100" y1="100" x2="32" y2="100" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/>
        </g>
        <circle cx="100" cy="100" r="7" fill="var(--ink)"/>
      </svg>
      <div class="big amt" id="leftBig"></div>
      <div class="muted" id="leftSub"></div>
      <div class="carry" id="carryNote" hidden></div>
    </div>
    <div class="mood" id="weekMood"><div class="face"></div><div><b></b><span class="muted"></span></div></div>
  </section>

  <!-- add -->
  <section class="card">
    <h2>הוספת הוצאה</h2>
    <form class="add" id="addForm" autocomplete="off">
      <input class="amount full" id="amount" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="סכום ב־₪" required>
      <input id="note" type="text" placeholder="על מה? (לא חובה)">
      <input id="date" type="date" required>
      <button class="primary full" type="submit">הוספה</button>
    </form>
  </section>

  <!-- this week's items -->
  <section class="card">
    <h2>ההוצאות של השבוע</h2>
    <ul class="list" id="weekItems"></ul>
  </section>

  <!-- month -->
  <section class="card" id="monthCard">
    <div class="row"><h2 id="monthTitle"></h2><span class="pill now">בתהליך</span></div>
    <div class="bar"><span id="monthBar"></span><i id="monthPace"></i></div>
    <div class="row muted"><span id="monthSpent"></span><span id="monthLimit"></span></div>
    <div class="mood" id="monthMood"><div class="face"></div><div><b></b><span class="muted"></span></div></div>
  </section>

  <section class="card" id="lastMonthCard" hidden></section>

  <section class="card">
    <h2>היסטוריה</h2>
    <div class="muted" id="bank"></div>
    <details open><summary>חודשים</summary><ul class="list" id="monthList"></ul></details>
    <details><summary>שבועות</summary><ul class="list" id="weekList"></ul></details>
  </section>
</main>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h2>הגדרות</h2>
    <label for="sWeekly">תקציב שבועי (₪)</label>
    <input id="sWeekly" type="number" min="1" step="1" required>
    <label for="sMonthly">תקציב חודשי (₪) — ריק = מחושב מהשבועי</label>
    <input id="sMonthly" type="number" min="1" step="1" placeholder="אוטומטי">
    <div class="actions">
      <button class="primary" value="save">שמירה</button>
      <button value="cancel" formnovalidate>ביטול</button>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);margin:18px 0 6px">
    <div class="muted">הנתונים נשמרים בדפדפן הזה בלבד. כדי להעביר למכשיר אחר — ייצוא ואז ייבוא.</div>
    <div class="actions">
      <button type="button" id="exportBtn">ייצוא קובץ</button>
      <button type="button" id="importBtn">ייבוא קובץ</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </form>
</dialog>

<script>
const KEY = 'budget-fuel-v1';
const $ = id => document.getElementById(id);
const DEFAULTS = { weeklyLimit: 1000, monthlyLimit: null, expenses: [] };

function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.expenses)) return { ...DEFAULTS, ...s }; }
  catch(e){}
  return { ...DEFAULTS, expenses: [] };
}
let state = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

/* ---------- dates (local, as YYYY-MM-DD strings) ---------- */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const weekStart = s => { const d = parse(s); d.setDate(d.getDate() - d.getDay()); return ymd(d); }; // week starts Sunday
const today = () => ymd(new Date());
const short = s => { const d = parse(s); return `${d.getDate()}/${d.getMonth()+1}`; };
const daysInMonth = (y,m) => new Date(y, m, 0).getDate();   // m is 1-based
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const monthName = key => { const [y,m] = key.split('-').map(Number); return `${MONTHS[m-1]} ${y}`; };

const fmt = new Intl.NumberFormat('he-IL', { style:'currency', currency:'ILS', maximumFractionDigits:2, minimumFractionDigits:0 });
const money = n => fmt.format(Math.round(n*100)/100);
const sum = arr => arr.reduce((a,e) => a + e.amount, 0);

/* ---------- budget logic ---------- */
// Weekly: overspending carries forward as a deduction from the next week's limit.
// Unused money does NOT carry forward (it shows up as monthly savings instead).
function computeWeeks(){
  const cur = weekStart(today());
  let first = cur, last = cur;
  const byWeek = {};
  for (const e of state.expenses){
    const w = weekStart(e.date);
    (byWeek[w] ||= []).push(e);
    if (w < first) first = w;
    if (w > last) last = w;
  }
  const weeks = [];
  let deficit = 0;
  for (let w = first; w <= last; w = addDays(w, 7)){
    const items = (byWeek[w] || []).sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);
    const spent = sum(items);
    const limit = state.weeklyLimit - deficit;
    const over = Math.max(0, spent - limit);
    weeks.push({ start:w, end:addDays(w,6), items, spent, limit, carried:deficit, over, current: w === cur });
    deficit = over;
  }
  return weeks;
}

function monthLimit(key){
  if (state.monthlyLimit) return state.monthlyLimit;
  const [y,m] = key.split('-').map(Number);
  return Math.round(state.weeklyLimit * daysInMonth(y,m) / 7);
}

function computeMonths(){
  const curKey = today().slice(0,7);
  const byMonth = {};
  for (const e of state.expenses) (byMonth[e.date.slice(0,7)] ||= []).push(e);
  let firstKey = curKey;
  for (const k in byMonth) if (k < firstKey) firstKey = k;
  const months = [];
  let [y,m] = firstKey.split('-').map(Number);
  for(;;){
    const key = `${y}-${pad(m)}`;
    if (key > curKey) break;
    const spent = sum(byMonth[key] || []);
    const limit = monthLimit(key);
    months.push({ key, spent, limit, diff: limit - spent, done: key < curKey });
    if (++m > 12){ m = 1; y++; }
  }
  return months;
}

/* ---------- gauge ---------- */
const R = 80, CX = 100, CY = 100;
const pt = f => { const a = Math.PI * (1 - f); return [CX + R*Math.cos(a), CY - R*Math.sin(a)]; };
const arc = (f1,f2) => { const [x1,y1] = pt(f1), [x2,y2] = pt(f2); return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${R} ${R} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`; };
$('arcRed').setAttribute('d', arc(0, .2));
$('arcAmber').setAttribute('d', arc(.2, .45));
$('arcGreen').setAttribute('d', arc(.45, 1));
$('ticks').innerHTML = [0,.25,.5,.75,1].map(f => {
  const a = Math.PI*(1-f), c = Math.cos(a), s = Math.sin(a);
  return `<line x1="${CX+(R-14)*c}" y1="${CY-(R-14)*s}" x2="${CX+(R-22)*c}" y2="${CY-(R-22)*s}"/>`;
}).join('');

function setMood(el, cls, face, title, sub){
  el.className = 'mood ' + cls;
  el.querySelector('.face').textContent = face;
  el.querySelector('b').textContent = title;
  el.querySelector('.muted').textContent = sub;
}

/* ---------- render ---------- */
function render(){
  const weeks = computeWeeks();
  const wk = weeks.find(w => w.current);
  const left = wk.limit - wk.spent;
  const frac = wk.limit > 0 ? Math.min(1, Math.max(0, left / wk.limit)) : 0;

  $('weekRange').textContent = `${short(wk.start)} – ${short(wk.end)}`;
  $('needle').style.transform = `rotate(${frac*180}deg)`;
  const low = frac < .2;
  $('lamp').classList.toggle('on', low);
  $('lamp').setAttribute('opacity', low ? 1 : .15);
  $('leftBig').textContent = left >= 0 ? money(left) : '−' + money(-left);
  $('leftBig').style.color = left < 0 ? 'var(--red)' : low ? 'var(--amber)' : 'var(--ink)';
  $('leftSub').textContent = left >= 0
    ? `נשאר מתוך ${money(wk.limit)} · הוצאנו ${money(wk.spent)}`
    : `חרגנו מתוך ${money(wk.limit)} · הוצאנו ${money(wk.spent)}`;
  $('carryNote').hidden = !wk.carried;
  $('carryNote').textContent = wk.carried ? `ירדו ${money(wk.carried)} מהתקציב השבוע בגלל חריגה בשבוע שעבר` : '';

  if (left < 0)        setMood($('weekMood'), 'sad',  '😬', `חרגנו ב־${money(-left)}`, 'הסכום הזה ירד מהתקציב של השבוע הבא.');
  else if (frac < .2)  setMood($('weekMood'), 'warn', '⛽', 'הדלק עומד להיגמר!', `נשארו רק ${money(left)} עד סוף השבוע.`);
  else if (frac < .45) setMood($('weekMood'), 'happy','🙂', 'עדיין בתוך התקציב', 'כדאי להאט קצת.');
  else                 setMood($('weekMood'), 'happy', wk.spent === 0 ? '🌞' : '🥳', 'עומדות בתקציב!', 'ממשיכות ככה.');

  // this week's items
  $('weekItems').innerHTML = wk.items.length ? wk.items.map(e => `
    <li><span class="muted">${short(e.date)}</span>
        <span class="grow">${esc(e.note) || '<span class="muted">—</span>'}</span>
        <span class="amt">${money(e.amount)}</span>
        <button class="del" data-id="${e.id}" aria-label="מחיקה">✕</button></li>`).join('')
    : '<li class="muted">עוד לא הוכנסו הוצאות השבוע.</li>';

  // current month
  const months = computeMonths();
  const cm = months[months.length-1];
  const [cy,cmn] = cm.key.split('-').map(Number);
  const dom = new Date().getDate(), dim = daysInMonth(cy,cmn);
  const pace = cm.limit * dom / dim;
  $('monthTitle').textContent = monthName(cm.key);
  const pct = Math.min(100, cm.spent / cm.limit * 100);
  $('monthBar').style.width = pct + '%';
  $('monthBar').style.background = cm.spent > cm.limit ? 'var(--red)' : cm.spent > pace ? 'var(--amber)' : 'var(--green)';
  $('monthPace').style.insetInlineStart = Math.min(100, dom/dim*100) + '%';
  $('monthPace').title = 'הקצב הצפוי עד היום';
  $('monthSpent').textContent = `הוצאנו ${money(cm.spent)}`;
  $('monthLimit').textContent = `מתוך ${money(cm.limit)}`;
  if (cm.spent > cm.limit)  setMood($('monthMood'), 'sad',  '🌧️', `החודש כבר חרגנו ב־${money(cm.spent - cm.limit)}`, 'עוד אפשר לצמצם את הנזק עד סוף החודש.');
  else if (cm.spent > pace) setMood($('monthMood'), 'warn', '🐢', 'קצת מעל הקצב', `לפי הקצב הרגיל היינו אמורות להיות על ${money(pace)}.`);
  else                      setMood($('monthMood'), 'happy','🌱', `בדרך לחסוך ${money(cm.limit - cm.spent)}`, `מתחת לקצב — לפי הקצב הרגיל היינו על ${money(pace)}.`);

  // verdict for last completed month
  const done = months.filter(m => m.done);
  const lm = done[done.length-1];
  const lmCard = $('lastMonthCard');
  lmCard.hidden = !lm;
  if (lm) lmCard.innerHTML = verdictHTML(lm);

  const bank = done.reduce((a,m) => a + m.diff, 0);
  $('bank').textContent = done.length
    ? (bank >= 0 ? `💰 סך החיסכון בכל החודשים שנסגרו: ${money(bank)}` : `סך החריגה בכל החודשים שנסגרו: ${money(-bank)}`)
    : 'עוד לא נסגר אף חודש.';

  $('monthList').innerHTML = months.slice().reverse().map(m => `
    <li><span class="grow">${monthName(m.key)}</span>
        <span class="amt">${money(m.spent)}</span>
        ${!m.done ? '<span class="pill now">בתהליך</span>'
          : m.diff >= 0 ? `<span class="pill ok">חסכנו ${money(m.diff)}</span>`
          : `<span class="pill bad">חריגה ${money(-m.diff)}</span>`}</li>`).join('');

  $('weekList').innerHTML = weeks.slice().reverse().map(w => `
    <li><span class="grow">${short(w.start)}–${short(w.end)}${w.carried ? ` <span class="muted">(תקציב ${money(w.limit)})</span>` : ''}</span>
        <span class="amt">${money(w.spent)}</span>
        ${w.current ? '<span class="pill now">השבוע</span>'
          : w.over ? `<span class="pill bad">חריגה ${money(w.over)}</span>` : '<span class="pill ok">✓</span>'}</li>`).join('');
}

function verdictHTML(m){
  const pct = Math.round(Math.abs(m.diff) / m.limit * 100);
  if (m.diff >= 0) return `
    <div class="verdict win">
      <div class="face">🏆</div>
      <h3>${monthName(m.key)}: עמדנו ביעד!</h3>
      <div class="muted">הוצאנו ${money(m.spent)} מתוך ${money(m.limit)}</div>
      <div class="score">💰 חסכנו ${money(m.diff)} (${pct}% מהתקציב)</div>
    </div>`;
  return `
    <div class="verdict lose">
      <div class="face">🌧️</div>
      <h3>${monthName(m.key)}: לא עמדנו ביעד</h3>
      <div class="muted">הוצאנו ${money(m.spent)} מתוך ${money(m.limit)}</div>
      <div class="score">חרגנו ב־${money(-m.diff)} (${pct}%) — החודש הזה הזדמנות חדשה</div>
    </div>`;
}

function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const bits = ['🎉','✨','💚','⭐','🎊'];
  for (let i = 0; i < 26; i++){
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = bits[i % bits.length];
    s.style.left = Math.random()*100 + 'vw';
    s.style.animationDelay = Math.random()*.6 + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 3000);
  }
}

/* ---------- events ---------- */
$('date').value = today();
$('date').max = today();

$('addForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const amount = parseFloat($('amount').value);
  if (!(amount > 0)) return;
  state.expenses.push({ id: Date.now(), date: $('date').value, amount, note: $('note').value.trim() });
  save();
  render();
  const wk = computeWeeks().find(w => w.current);
  if (wk.spent <= wk.limit) confetti();
  $('amount').value = ''; $('note').value = ''; $('date').value = today();
  $('amount').focus();
});

$('weekItems').addEventListener('click', ev => {
  const b = ev.target.closest('.del'); if (!b) return;
  if (!confirm('למחוק את ההוצאה?')) return;
  state.expenses = state.expenses.filter(e => e.id !== Number(b.dataset.id));
  save(); render();
});

$('openSettings').onclick = () => {
  $('sWeekly').value = state.weeklyLimit;
  $('sMonthly').value = state.monthlyLimit || '';
  $('settings').showModal();
};
$('settings').addEventListener('close', () => {
  if ($('settings').returnValue !== 'save') return;
  state.weeklyLimit = Math.max(1, Number($('sWeekly').value) || DEFAULTS.weeklyLimit);
  state.monthlyLimit = Number($('sMonthly').value) || null;
  save(); render();
});

$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `budget-${today()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!Array.isArray(s.expenses)) throw 0;
    if (!confirm(`לייבא ${s.expenses.length} הוצאות? הנתונים הנוכחיים יוחלפו.`)) return;
    state = { ...DEFAULTS, ...s }; save(); render(); $('settings').close();
  } catch(e){ alert('הקובץ לא תקין'); }
  ev.target.value = '';
};

render();
</script>
</body>
</html>
